# =============================================================================
# Lancement : docker compose up -d   ->   http://localhost:3000
#
# Les reglages se font dans le fichier .env a cote de ce fichier :
#     cp .env.example .env
# Les valeurs apres « :- » ci-dessous sont les defauts si .env est absent.
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: essence:latest
    container_name: essence
    restart: unless-stopped

    # "port sur la machine hote : port dans le conteneur"
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"

    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      PRICES_TTL_SECONDS: "${PRICES_TTL_SECONDS:-1200}"
      BRANDS_TTL_SECONDS: "${BRANDS_TTL_SECONDS:-86400}"
      QUERY_TTL_SECONDS: "${QUERY_TTL_SECONDS:-60}"
      FETCH_TIMEOUT_MS: "${FETCH_TIMEOUT_MS:-60000}"
      DEFAULT_RADIUS_KM: "${DEFAULT_RADIUS_KM:-15}"
      MAX_RADIUS_KM: "${MAX_RADIUS_KM:-50}"
      MAX_RESULTS: "${MAX_RESULTS:-300}"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    # L'application ne garde rien sur disque : tout le cache est en memoire.
    # Le systeme de fichiers peut donc rester en lecture seule.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    # Garde-fous : l'app tourne confortablement en dessous de 256 Mo.
    deploy:
      resources:
        limits:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
